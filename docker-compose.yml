# Docker Compose orchestrates the FastAPI backend and Streamlit frontend.
# Both services share the same image but run different commands.

services:
  backend:
    build: .
    container_name: credit-risk-backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_PATH: models/lightgbm.pkl
      DATABASE_PATH: data/home_credit.db
      LOG_LEVEL: INFO
    volumes:
      # Bind mounts keep models/data editable without rebuilding the image.
      - ./data:/app/data
      - ./models:/app/models
      - ./documents:/app/documents
    restart: unless-stopped

  frontend:
    build: .
    container_name: credit-risk-frontend
    command: >
      streamlit run src/ui/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      MODEL_PATH: models/lightgbm.pkl
      DATABASE_PATH: data/home_credit.db
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./assets:/app/assets
      - ./documents:/app/documents
    depends_on:
      - backend
    restart: unless-stopped
